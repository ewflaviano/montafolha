name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: dist/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: site
          path: dist/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '872515289365'
      - name: Update diagnostics API
        run: |
          zip -j diagnostics.zip backend/index.mjs
          aws lambda update-function-code --function-name montafolha-diagnostics --zip-file fileb://diagnostics.zip
          aws lambda wait function-updated --function-name montafolha-diagnostics
      - name: Upload hashed assets
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete --exclude index.html --exclude exemplo-grade.png --exclude pix-montafolha.svg --cache-control 'public,max-age=31536000,immutable'
      - name: Upload HTML
        run: aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" --cache-control 'no-cache,max-age=0,must-revalidate' --content-type 'text/html; charset=utf-8'
      - name: Upload example image
        run: aws s3 cp dist/exemplo-grade.png "s3://${{ vars.S3_BUCKET }}/exemplo-grade.png" --cache-control 'no-cache,max-age=0,must-revalidate' --content-type image/png
      - name: Upload Pix QR code
        run: aws s3 cp dist/pix-montafolha.svg "s3://${{ vars.S3_BUCKET }}/pix-montafolha.svg" --cache-control 'no-cache,max-age=0,must-revalidate' --content-type image/svg+xml
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'
